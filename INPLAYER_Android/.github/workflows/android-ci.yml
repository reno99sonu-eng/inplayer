name: Android CI

on:
  push:
    branches: [ main, homepage-phase-2 ]
  pull_request:
    branches: [ main, homepage-phase-2 ]

jobs:
  analyze-and-test:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-pub

      - name: Flutter test
        run: flutter test --no-pub