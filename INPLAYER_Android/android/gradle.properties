# The dev machine has 7.6 GB RAM total; an 8 GB heap made Gradle swap to disk
# (50+ minute builds, AAPT2 timing out on launcher_peacock.png).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true

android.useAndroidX=true

# Flutter template flags
android.newDsl=false
android.builtInKotlin=false

# Disable Kotlin incremental compilation
kotlin.incremental=false

# Disable Kotlin build cache
kotlin.caching.enabled=false

# Disable Gradle build cache
org.gradle.caching=false
# Fixes "Unable to establish loopback connection" on this Windows machine
org.gradle.daemon=false
