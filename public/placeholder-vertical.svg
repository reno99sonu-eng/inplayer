<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f0f13" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18" />
      <stop offset="50%" stop-color="#ff9a00" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="720" height="1280" fill="url(#bgGrad)" />
  
  <!-- Ambient glow orbs -->
  <circle cx="360" cy="540" r="220" fill="#ff7a18" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="800" r="160" fill="#ff4500" opacity="0.1" filter="url(#glow)" />
  
  <!-- Subtle Grid Pattern / Frame -->
  <rect x="30" y="30" width="660" height="1220" rx="32" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />
  
  <!-- Film Clapper / Icon -->
  <g transform="translate(360, 520) scale(1.6)">
    <circle cx="0" cy="0" r="60" fill="rgba(255,255,255,0.05)" stroke="url(#accentGrad)" stroke-width="3" />
    <!-- Film Reel / Play Shape -->
    <path d="M-15,-25 L25,0 L-15,25 Z" fill="url(#accentGrad)" />
  </g>
  
  <!-- Typography -->
  <text x="360" y="690" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="36" fill="#ffffff" letter-spacing="1">
    RAFTAR FILMS
  </text>
  <text x="360" y="736" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="rgba(255,255,255,0.45)" letter-spacing="3">
    MICRO-SERIES
  </text>
  
  <!-- Bottom gradient bar -->
  <rect x="260" y="770" width="200" height="4" rx="2" fill="url(#accentGrad)" opacity="0.8" />
</svg>
